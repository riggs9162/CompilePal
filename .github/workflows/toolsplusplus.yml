name: CompilePal++ Windows build

'on':
  push:
    branches: [toolspp/standalone-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run compiler and configuration regressions
        run: dotnet run --project ToolsPlusPlus.Tests/ToolsPlusPlus.Tests.csproj -c Release
      - name: Run compile lifecycle regressions
        run: dotnet run --project ToolsPlusPlus.ManagerTests/ToolsPlusPlus.ManagerTests.csproj -c Release
      - name: Run workspace and appearance regressions
        run: dotnet run --project Workspace.Tests/Workspace.Tests.csproj -c Release -r win-x64 -- CompilePalX artifacts/ui-checks
      - name: Build Windows x64 application
        run: dotnet publish CompilePalX/CompilePalX.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CompilePalPlusPlus
      - name: Ensure runtime directories exist
        shell: pwsh
        run: |
          foreach ($folder in @('Plugins', 'Presets', 'GameConfiguration')) {
            New-Item -ItemType Directory -Path "artifacts/CompilePalPlusPlus/$folder" -Force | Out-Null
          }
          Set-Content -LiteralPath "artifacts/CompilePalPlusPlus/SOURCE.txt" -Value "Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: CompilePalPlusPlus-win-x64
          path: artifacts/CompilePalPlusPlus/
          if-no-files-found: error
